// feet. Plan (x, y) and height z map to three.js (x, z, -y).
const R = 0.7, STEP = 0.85, HEAD = 5.9, EYE = 5.33, WALK = 6.5, RUN = 13, GRAVITY = 32, JUMP = 10.5;

const PLACES = [["Street", 20, -13.5, -1.5, 8], ["Entry", 25.6, 4, 0, 0], ["Top of the stairs", 25.8, 18.5, 10, 90],

  ["Rear bedroom", 44, 22, 10, 0], ["Garage", 12, 8, -1.5, 0], ["Back yard", 42, 36, 0, 200], ["Primary bath", 33.2, 13.9, 10, 268]];

const area = (a) => { let s = 0; for (let i = 0, n = a.length / 2; i < n; i++) { const j = (i + 1) % n; s += a[2 * i] * a[2 * j + 1] - a[2 * j] * a[2 * i + 1]; } return s / 2; };

}

    const t = Math.max(0, Math.min(1, ((x - ax) * dx + (y - ay) * dy) / (dx * dx + dy * dy || 1)));

    if (d < best) { best = d; bx = px; by = py; }

}

// ---- the world for collisions ----
let solids = [], grid = new Map(), groundZ = -1.6;
const NO_BUMP = new Set(["door", "fan", "canvas", "shutter", "dark"].map((m) => DATA.mats.indexOf(m)));
const FURNITURE = DATA.cols.indexOf("Furniture");

function loadWorld(scene) {
  solids = []; grid = new Map(); groundZ = scene.ground;
  for (const [a, z0, z1, m, c, open] of scene.p) {
    const smallFurniture = c === FURNITURE && Math.abs(area(a)) < 3;      // chairs and table legs don't trap you
    const s = { a, z0, z1, bump: !open && !NO_BUMP.has(m) && !smallFurniture, floor: !open && !NO_BUMP.has(m) && !smallFurniture };
    if (!s.bump && !s.floor) continue;
    const xs = a.filter((_, i) => i % 2 === 0), ys = a.filter((_, i) => i % 2 === 1);
    const x0 = Math.floor(Math.min(...xs) / CELL), x1 = Math.floor(Math.max(...xs) / CELL);
    const y0 = Math.floor(Math.min(...ys) / CELL), y1 = Math.floor(Math.max(...ys) / CELL);
    for (let i = x0; i <= x1; i++) for (let j = y0; j <= y1; j++) {
      const k = i + "," + j;
      if (!grid.has(k)) grid.set(k, []);
      grid.get(k).push(s);
    }
  }
}
function near(x, y) {
  const out = new Set();
  const cx = Math.floor(x / CELL), cy = Math.floor(y / CELL);
  for (let i = cx - 1; i <= cx + 1; i++) for (let j = cy - 1; j <= cy + 1; j++) {
    const c = grid.get(i + "," + j);
    if (c) for (const s of c) out.add(s);
  }

}

  let z = groundZ;
  for (const s of near(x, y)) if (s.floor && s.z1 <= feet + STEP && s.z1 > z && pointIn(x, y, s.a)) z = s.z1;
  return z;
}
function pushOut(p) {

    for (const s of near(p.x, p.y)) {
      if (!s.bump || s.z1 <= p.feet + STEP || s.z0 >= p.feet + HEAD) continue;
      const [d, bx, by] = closest(p.x, p.y, s.a);
      const isIn = pointIn(p.x, p.y, s.a);
      if (!isIn && d >= R) continue;
      const nx = d > 1e-6 ? (p.x - bx) / d : 1, ny = d > 1e-6 ? (p.y - by) / d : 0;
      const push = isIn ? -(d + R) : R - d;

// ---- the player ----
const P = { x: 25.6, y: -7, feet: -1.5, vz: 0, yaw: 0, pitch: 0, grounded: true, eye: -1.5 + EYE };
const keys = {};
function step(dt) {
  const f = (keys.KeyW ? 1 : 0) - (keys.KeyS ? 1 : 0), s = (keys.KeyD ? 1 : 0) - (keys.KeyA ? 1 : 0);
  const speed = keys.ShiftLeft || keys.ShiftRight ? RUN : WALK, n = Math.hypot(f, s) || 1;
  const sy = Math.sin(P.yaw), cy = Math.cos(P.yaw);
  const vx = (f * sy + s * cy) / n * speed, vy = (f * cy - s * sy) / n * speed;
  const sub = Math.max(1, Math.ceil(speed * dt / 0.25));
  for (let i = 0; i < sub; i++) {
    P.x += vx * dt / sub; P.y += vy * dt / sub;
    pushOut(P);
    const g = floorUnder(P.x, P.y, P.feet);
    if (P.grounded && g >= P.feet - STEP) P.feet = g;       // up and down stairs without bouncing
    else if (P.grounded) P.grounded = false;
  }
  if (keys.Space && P.grounded) { P.vz = JUMP; P.grounded = false; }
  if (!P.grounded) {
    P.vz -= GRAVITY * dt; P.feet += P.vz * dt;
    for (const s of near(P.x, P.y)) if (P.vz > 0 && s.bump && s.z0 >= P.feet + HEAD - 0.5 && s.z0 < P.feet + HEAD + 0.5 && pointIn(P.x, P.y, s.a)) P.vz = 0;
    const g = floorUnder(P.x, P.y, Math.max(P.feet, P.feet - P.vz * dt));
    if (P.feet <= g && P.vz <= 0) { P.feet = g; P.vz = 0; P.grounded = true; }
    pushOut(P);
  }
  P.eye += (P.feet + EYE - P.eye) * Math.min(1, dt * 14);
}
function place(i) {
  const [, x, y, z, yaw] = PLACES[i];
  Object.assign(P, { x, y, feet: z + 0.5, vz: 0, yaw: yaw * Math.PI / 180, pitch: 0, grounded: false, eye: z + EYE });
  P.feet = floorUnder(x, y, z + 0.5); P.grounded = true; P.eye = P.feet + EYE;
}

// ---- the sun ----
function sunVector(month, day, hour) {
  const n = Math.round((Date.UTC(2026, month - 1, day) - Date.UTC(2026, 0, 0)) / 86400000);
  const decl = -23.44 * Math.PI / 180 * Math.cos(2 * Math.PI * (n + 10) / 365), b = 2 * Math.PI * (n - 81) / 364;
  const eot = 9.87 * Math.sin(2 * b) - 7.53 * Math.cos(b) - 1.5 * Math.sin(b);
  const h = 15 * (hour - 1 + (4 * (LON + 75) + eot) / 60 - 12) * Math.PI / 180, lat = LAT * Math.PI / 180;
  const elev = Math.asin(Math.sin(lat) * Math.sin(decl) + Math.cos(lat) * Math.cos(decl) * Math.cos(h));
  const az = Math.atan2(-Math.cos(decl) * Math.sin(h), Math.sin(decl) * Math.cos(lat) - Math.cos(decl) * Math.cos(h) * Math.sin(lat));
  const a = SURVEY_NORTH * Math.PI / 180 - az;
  return { x: Math.cos(elev) * Math.cos(a), y: Math.cos(elev) * Math.sin(a), z: Math.sin(elev), elev };
}

// ---- textures, painted once from code; colours follow the owner's and listing photos ----
const SIZE = 1024;
function rng(seed) { let s = seed; return () => (s = (s * 16807) % 2147483647) / 2147483647; }

  for (let i = 0; i < d.length; i += 4) { const n = (r() - 0.5) * amount; d[i] += n; d[i + 1] += n; d[i + 2] += n; }

function fill(ctx, c) { ctx.fillStyle = c; ctx.fillRect(0, 0, SIZE, SIZE); }
const rgb = (r, g, b) => `rgb(${r | 0},${g | 0},${b | 0})`;

        y += len;
      }
      ctx.fillStyle = "rgba(25,12,5,.7)"; ctx.fillRect(i * w - 0.75, 0, 1.5, SIZE);

}

        ctx.fillStyle = `rgba(${streak},${0.03 + r() * 0.07})`;
        ctx.fillRect(x + r() * W * 0.7, j * H + r() * H, W * (0.15 + r() * 0.3), 1 + r() * 2.5);

    if (!v) continue;
    const r = Math.sqrt(r2), c = -(dx * n[0] + dy * n[1] + dz * n[2]) / r;
    w += v * G.A * toward * (0.25 + 0.75 * Math.max(0, c)) / (r2 + G.A);
  }
  w = 1.5 * w / (1 + 0.32 * w);
  const bounce = 0.17 + 0.2 * Math.min(1, w);
  day[0] = (bounce + w * 0.8) * ao; day[1] = (bounce + w * 0.9) * ao; day[2] = (bounce + w * 1.02) * ao;
  fix[0] = (fix[0] + 0.05) * ao; fix[1] = (fix[1] + 0.04) * ao; fix[2] = (fix[2] + 0.03) * ao;
  return { fix, day };
}

function buildMeshes(scene) {
  const t0 = performance.now();
  if (!baked[planIndex]) {
    const rooms = buildRooms(scene); buildLights(scene, rooms); makeFields(scene, rooms);
    baked[planIndex] = rooms;
  }
  LV = baked[planIndex];
  const groups = new Map();
  const groupFor = (finish) => {
    if (!groups.has(finish)) groups.set(finish, { pos: [], uv: [], fix: [], day: [] });
    return groups.get(finish);
  };
  const levelOf = (z) => (z < 9.99 ? LV[0] : LV[1]);
  const seenLight = new Map();                                    // triangles share corners: light each corner once
  function vertex(g, p, n, tint, ft) {
    const key = Math.round(p[0] * 50) + "," + Math.round(p[1] * 50) + "," + Math.round(p[2] * 50) + "," + Math.round(n[0] * 9) + "," + Math.round(n[1] * 9) + "," + Math.round(n[2] * 9);
    let lit = seenLight.get(key);
    if (!lit) { lit = lightAt(p, n, levelOf(p[2] + n[2] * 0.6)); seenLight.set(key, lit); }
    const { fix, day } = lit;
    g.pos.push(p[0], p[2], -p[1]);
    let u, v;
    if (Math.abs(n[2]) > 0.7) { u = p[0]; v = p[1]; }
    else { const l = Math.hypot(n[0], n[1]) || 1; u = -n[1] / l * p[0] + n[0] / l * p[1]; v = p[2]; }
    g.uv.push(u / ft, v / ft);
    g.fix.push(fix[0] * tint[0], fix[1] * tint[1], fix[2] * tint[2]);
    g.day.push(day[0] * tint[0], day[1] * tint[1], day[2] * tint[2]);
  }
  function leaf(name, a, b, c, n) {
    const cen = [(a[0] + b[0] + c[0]) / 3, (a[1] + b[1] + c[1]) / 3, (a[2] + b[2] + c[2]) / 3];
    const q = [cen[0] + n[0] * 0.6, cen[1] + n[1] * 0.6, cen[2] + n[2] * 0.6];
    const lv = levelOf(q[2]);
    if (name === "glass") { const g = groupFor("glass"); for (const p of [a, b, c]) { g.pos.push(p[0], p[2], -p[1]); g.uv.push(0, 0); g.fix.push(0, 0, 0); g.day.push(1, 1, 1); } return; }
    // a point that lands inside a wall (door reveals, corners) takes its whole face's finish, so finishes don't break up
    const here = roomAt(lv, q[0], q[1]);
    const [finish, tint = [1, 1, 1]] = surfaceFinish(name, n, here === -1 ? faceAt : q, lv, here === -1 ? roomNear(lv, faceAt[0], faceAt[1]) : here);
    const g = groupFor(finish), ft = FINISHES[finish][0];
    vertex(g, a, n, tint, ft); vertex(g, b, n, tint, ft); vertex(g, c, n, tint, ft);
  }
  function tri(name, a, b, c, n) {
    const ab = Math.hypot(a[0] - b[0], a[1] - b[1], a[2] - b[2]), bc = Math.hypot(b[0] - c[0], b[1] - c[1], b[2] - c[2]), ca = Math.hypot(c[0] - a[0], c[1] - a[1], c[2] - a[2]);
    const longest = Math.max(ab, bc, ca);
    if (longest < 2.2 || name === "glass") { leaf(name, a, b, c, n); return; }
    const mid = (p, q) => [(p[0] + q[0]) / 2, (p[1] + q[1]) / 2, (p[2] + q[2]) / 2];
    if (longest === ab) { const m = mid(a, b); tri(name, a, m, c, n); tri(name, m, b, c, n); }
    else if (longest === bc) { const m = mid(b, c); tri(name, a, b, m, n); tri(name, a, m, c, n); }
    else { const m = mid(c, a); tri(name, a, b, m, n); tri(name, m, b, c, n); }
  }
  const normal = (a, b, c) => {
    const ux = b[0] - a[0], uy = b[1] - a[1], uz = b[2] - a[2], vx = c[0] - a[0], vy = c[1] - a[1], vz = c[2] - a[2];
    const x = uy * vz - uz * vy, y = uz * vx - ux * vz, z = ux * vy - uy * vx, l = Math.hypot(x, y, z) || 1;
    return [x / l, y / l, z / l];
  };
  let faceAt = [0, 0, 0];                 // the middle of the face being built: the midpoint of its longest edge is shared by a quad's two triangles
  const face = (name, a, b, c) => {
    const n = normal(a, b, c), d = (p, q) => Math.hypot(p[0] - q[0], p[1] - q[1], p[2] - q[2]);
    const [p, q] = [[a, b], [b, c], [c, a]].sort((u, v) => d(v[0], v[1]) - d(u[0], u[1]))[0];
    faceAt = [(p[0] + q[0]) / 2 + n[0] * 0.6, (p[1] + q[1]) / 2 + n[1] * 0.6, (p[2] + q[2]) / 2 + n[2] * 0.6];
    tri(name, a, b, c, n);
  };
  for (let [a, z0, z1, m] of scene.p) {
    const name = DATA.mats[m];
    if (area(a) < 0) { const r = []; for (let i = a.length - 2; i >= 0; i -= 2) r.push(a[i], a[i + 1]); a = r; }
    const n = a.length / 2;
    const contour = []; for (let i = 0; i < n; i++) contour.push(new THREE.Vector2(a[2 * i], a[2 * i + 1]));
    for (const [i, j, k] of THREE.ShapeUtils.triangulateShape(contour, [])) {
      const c = contour, ccw = (c[j].x - c[i].x) * (c[k].y - c[i].y) - (c[j].y - c[i].y) * (c[k].x - c[i].x) > 0;
      const [p, q] = ccw ? [j, k] : [k, j];
      face(name, [c[i].x, c[i].y, z1], [c[p].x, c[p].y, z1], [c[q].x, c[q].y, z1]);
      face(name, [c[i].x, c[i].y, z0], [c[q].x, c[q].y, z0], [c[p].x, c[p].y, z0]);
    }
    for (let i = 0; i < n; i++) {
      const j = (i + 1) % n, A0 = [a[2 * i], a[2 * i + 1], z0], B0 = [a[2 * j], a[2 * j + 1], z0], A1 = [a[2 * i], a[2 * i + 1], z1], B1 = [a[2 * j], a[2 * j + 1], z1];
      face(name, A0, B0, B1); face(name, A0, B1, A1);
    }
  }
  for (const [v, faces, m] of scene.m) {
    const at = (i) => [v[3 * i], v[3 * i + 1], v[3 * i + 2]];
    for (const f of faces) for (let i = 1; i < f.length - 1; i++) face(DATA.mats[m], at(f[0]), at(f[i]), at(f[i + 1]));
  }
  const group = new THREE.Group();
  group.userData.baked = [];
  for (const [finish, g] of groups) {
    const geo = new THREE.BufferGeometry();
    geo.setAttribute("position", new THREE.Float32BufferAttribute(g.pos, 3));
    geo.setAttribute("uv", new THREE.Float32BufferAttribute(g.uv, 2));
    geo.setAttribute("color", new THREE.Float32BufferAttribute(new Float32Array(g.day.length), 3));
    geo.computeVertexNormals();
    let mat;
    if (finish === "glass") {
      mat = new THREE.MeshStandardMaterial({ roughness: 0.05, side: THREE.DoubleSide, transparent: true, opacity: 0.14, depthWrite: false, color: 0xbcd6ee });
    } else {
      const [, , tint, rough, bump] = FINISHES[finish], tex = textureFor(finish);
      mat = new THREE.MeshStandardMaterial({ map: tex, roughness: rough, vertexColors: true, side: THREE.DoubleSide });
      mat.color.setRGB(tint[0], tint[1], tint[2]);
      if (bump) { mat.bumpMap = tex; mat.bumpScale = bump; }
    }
    const mesh = new THREE.Mesh(geo, mat);
    mesh.castShadow = finish !== "glass"; mesh.receiveShadow = finish !== "glass";
    group.add(mesh);
    if (finish !== "glass") group.userData.baked.push({ color: geo.attributes.color, fix: new Float32Array(g.fix), day: new Float32Array(g.day) });
  }
  const groundTex = textureFor("asphalt").clone(); groundTex.repeat.set(150, 150); groundTex.needsUpdate = true;
  const ground = new THREE.Mesh(new THREE.PlaneGeometry(1200, 1200), new THREE.MeshStandardMaterial({ map: groundTex, roughness: 1 }));
  ground.rotation.x = -Math.PI / 2; ground.position.y = scene.ground - 0.02; ground.receiveShadow = true;
  group.add(ground);
  group.userData.ms = Math.round(performance.now() - t0);
  return group;
}
function applyLight() {
  if (!world) return;
  const f = lightsOn ? 1 : 0, d = dayNow;
  for (const b of world.userData.baked) {
    const c = b.color.array;
    for (let i = 0; i < c.length; i++) c[i] = f * b.fix[i] + d * b.day[i];
    b.color.needsUpdate = true;
  }
}
function aimSun() {
  if (!renderer) return;
  const s = sunVector(9, 22, hour), up = Math.max(0, s.z);
  sun.position.set(30 + s.x * 200, Math.max(s.z, 0.02) * 200, -20 - s.y * 200);
  sun.intensity = 3.2 * Math.min(1, up * 3);
  dayNow = 0.12 + 0.88 * Math.min(1, up * 2.6);
  hemi.intensity = 1.5;
  scene3.background.setHSL(0.58, 0.55, 0.28 + 0.5 * Math.min(1, up * 2.6));
  renderer.shadowMap.needsUpdate = true;
  applyLight();
}
function usePlan(i) {
  planIndex = i;
  const scene = DATA.scenes[i];
  loadWorld(scene);
  if (renderer) {
    if (world) world.visible = false;
    if (!worlds[i]) { worlds[i] = buildMeshes(scene); scene3.add(worlds[i]); }     // kept, so going back to a plan is instant
    world = worlds[i];
    world.visible = true;
    LV = baked[i];
    aimSun();
  }
  P.feet = floorUnder(P.x, P.y, P.feet + 0.1);
  hud();
}
function hud() {
  const h12 = ((hour + 11) % 12) + 1, ap = hour < 12 ? "AM" : "PM";
  const plans = DATA.scenes.map((s, i) => (i === planIndex ? `<b>${i + 1} &nbsp;${s.label}</b>` : `<span style="opacity:.62">${i + 1} &nbsp;${s.label}</span>`)).join("<br>");
  document.getElementById("hud").innerHTML = `${plans}<div style="margin-top:6px">Sun: Sept 22, ${h12}:00 ${ap} &nbsp;· Lights ${lightsOn ? "on" : "off"}</div><div style="opacity:.8">Press Esc to exit</div>`;
}
function switchPlan(i) {                 // a plan's first build takes a moment; say so, and keep the player where they are
  const go = () => { usePlan(i); pushOut(P); };
  if (worlds[i] || !renderer) { go(); return; }
  document.getElementById("hud").innerHTML = `<b>Building ${DATA.scenes[i].label}…</b>`;
  setTimeout(go, 30);
}
function draw() {
  camera.position.set(P.x, P.eye, -P.y);
  camera.rotation.set(P.pitch, -P.yaw, 0);
  renderer.render(scene3, camera);
}

// ---- controls ----
const start = document.getElementById("start");
let ready = false, started = false;
start.addEventListener("click", () => {
  if (!ready) return;
  if (!started) { started = true; place(placeIndex); }       // only the first time: coming back after Esc keeps your spot
  document.getElementById("go").textContent = "Click to keep exploring";
  document.body.requestPointerLock();
});
document.getElementById("planlist").innerHTML = DATA.scenes.map((s, i) => `<tr><td>${i + 1}</td><td>Scheme ${s.label}</td></tr>`).join("");
document.addEventListener("pointerlockchange", () => { start.style.display = document.pointerLockElement ? "none" : "flex"; for (const k in keys) keys[k] = false; });
document.addEventListener("mousemove", (e) => {
  if (!document.pointerLockElement) return;
  P.yaw += e.movementX * 0.0022;
  P.pitch = Math.max(-1.45, Math.min(1.45, P.pitch - e.movementY * 0.0022));
});
addEventListener("keydown", (e) => {
  keys[e.code] = true;
  if (e.code === "Space") e.preventDefault();
  const d = /^Digit([1-7])$/.exec(e.code);
  if (d && +d[1] - 1 !== planIndex) switchPlan(+d[1] - 1);
  if (e.code === "KeyG") { placeIndex = (placeIndex + 1) % PLACES.length; place(placeIndex); }
  if (e.code === "KeyL") { lightsOn = !lightsOn; applyLight(); hud(); }
  if (e.code === "BracketLeft") { hour = Math.max(6, hour - 1); aimSun(); hud(); }
  if (e.code === "BracketRight") { hour = Math.min(19, hour + 1); aimSun(); hud(); }
});
addEventListener("keyup", (e) => { keys[e.code] = false; });

// ---- startup, and the self-tests the build runs (open with #test or #shot=<place number>[,<plan>]) ----
function selfTest() {
  const out = {};
  const hold = (code, s) => { keys[code] = true; for (let t = 0; t < s; t += 1 / 60) step(1 / 60); keys[code] = false; };
  const at = () => ({ x: +P.x.toFixed(2), y: +P.y.toFixed(2), feet: +P.feet.toFixed(2) });
  place(0); P.x = 25.6; P.y = -7; P.yaw = 0; out.spawn = at();
  hold("KeyW", 5); out.upTheStairs = at();
  place(3); P.yaw = -Math.PI / 2; hold("KeyW", 4); out.intoLotLineWall = at();
  P.x = 14; P.y = 26; P.feet = 10.01; P.yaw = 0; P.grounded = true; hold("KeyW", 3); out.outThroughGlassDoors = at();
  out.bakeMs = world ? world.userData.ms : null;
  out.rooms = LV ? LV.map((l) => l.rooms.map((r) => r.s + ":" + Math.round(r.sf))) : null;
  out.lamps = LV ? LV.map((l) => l.lamps.length) : null; out.panes = LV ? LV.map((l) => l.panes.length) : null;
  out.tris = world ? world.children.reduce((n, m) => n + m.geometry.attributes.position.count / 3, 0) : null;
  start.click();                                   // first click starts at the spawn point
  P.x = 9; P.y = 12; P.feet = 10.01;
  start.click(); out.afterEscAndClickBackIn = at();
  usePlan(2); pushOut(P); out.afterSwitchingPlan = at(); usePlan(0);
  document.getElementById("log").textContent = "TEST " + JSON.stringify(out);
  document.getElementById("log").style.display = "block";
}
function boot() {                      // after a first paint, so "Building" shows during the light calculation
  initGraphics();
  usePlan(0);
  place(0);
  ready = true;
  document.getElementById("go").textContent = "Click to start";
  const m = /#shot=(\d+)(?:,(\d+))?(?:,(-?[\d.]+))?/.exec(location.hash);    // place, plan, camera tilt
  if (location.hash === "#test") selfTest();
  if (m) {
    start.style.display = "none";
    if (m[2]) usePlan(+m[2]);
    place(+m[1]);
    if (m[3]) P.pitch = +m[3];
    draw();
  }
}
setTimeout(boot, 40);
let last = performance.now();
function frame(now) {
  requestAnimationFrame(frame);
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  if (document.pointerLockElement) step(dt);
  if (ready && renderer && !location.hash.startsWith("#test")) draw();
}
requestAnimationFrame(frame);
</script>
